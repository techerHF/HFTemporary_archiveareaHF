name: KKday public-page research

on:
  pull_request:
    paths:
      - 'kkday_research/**'
      - '.github/workflows/kkday-research.yml'
  push:
    branches:
      - main
    paths:
      - 'kkday_research/**'
      - '.github/workflows/kkday-research.yml'

permissions:
  contents: read

jobs:
  validate-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Run KKday research batch B
        run: python kkday_research/batch_b.py
      - name: Upload research output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kkday-research-output
          path: kkday_research/output/
          if-no-files-found: error
          retention-days: 7
